<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage and filter learning resources.">
    <meta name="author" content="Vivian Eze">
    <title>Resources - Task & Resource Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Task & Resource Tracker</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="tasks.html">Tasks</a>
                <a href="resources.html" class="active">Resources</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="tracker-section" aria-labelledby="resources-heading">
            <h2 id="resources-heading">Manage Resources</h2>

            <form id="resource-form">
                <div class="form-group">
                    <label for="resource-name">Resource Name</label>
                    <input type="text" id="resource-name" name="resource-name" placeholder="Example: JavaScript Documentation" required>
                </div>

                <div class="form-group">
                    <label for="resource-url">Resource URL</label>
                    <input type="url" id="resource-url" name="resource-url" placeholder="https://example.com" required>
                </div>

                <div class="form-group">
                    <label for="resource-category">Category</label>
                    <select id="resource-category" name="resource-category" required>
                        <option value="">Select a category</option>
                        <option value="Programming">Programming</option>
                        <option value="Study">Study</option>
                        <option value="Project">Project</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>

                <button type="submit">Add Resource</button>
            </form>

            <div class="filter-section">
                <div class="filter-control">
                    <label for="resource-search">Search Resources</label>
                    <input type="search" id="resource-search" placeholder="Search resources...">
                </div>

                <div class="filter-control">
                    <label for="resource-filter">Filter by Category</label>
                    <select id="resource-filter">
                        <option value="All">All Categories</option>
                        <option value="Programming">Programming</option>
                        <option value="Study">Study</option>
                        <option value="Project">Project</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>
            </div>

            <div id="resource-list" class="card-grid">
                <!-- Resources dynamic rendering -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Task & Resource Tracker | Vivian Eze</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
