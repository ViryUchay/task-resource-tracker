<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard overview for Task & Resource Tracker.">
    <meta name="author" content="Vivian Eze">
    <title>Dashboard - Task & Resource Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Task & Resource Tracker</h1>
            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="tasks.html">Tasks</a>
                <a href="resources.html">Resources</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="dashboard" aria-labelledby="dashboard-heading">
            <h2 id="dashboard-heading">Overview Dashboard</h2>
            <div class="stats-grid">
                <article class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="total-tasks">0</p>
                </article>
                <article class="stat-card">
                    <h3>Completed</h3>
                    <p id="completed-tasks">0</p>
                </article>
                <article class="stat-card">
                    <h3>Pending</h3>
                    <p id="pending-tasks">0</p>
                </article>
                <article class="stat-card">
                    <h3>Resources</h3>
                    <p id="total-resources">0</p>
                </article>
            </div>
        </section>

        <section class="recent-summary">
            <h2>Recent Activities Summary</h2>
            <div id="summary-content" class="card-grid">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Task & Resource Tracker | Vivian Eze</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
